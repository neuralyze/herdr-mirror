name: Update maintained Herdr mirror

# Install as .github/workflows/maintenance-update.yml in neuralyze/herdr-mirror
# after pinning both reuse and tool checkout to one trusted 40-hex tool commit.
# Daily UTC/manual runs propose a reviewed update; they never merge or deploy.
on:
  schedule:
    - cron: '47 3 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  update:
    if: github.repository == 'neuralyze/herdr-mirror' && github.ref == 'refs/heads/maintained'
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    uses: neuralyze/herdr-maintenance/.github/workflows/component-update.yml@37bb948a0ea8aa0f8ddd02f609d5ddcf42e05d97
    with:
      product: herdr-mirror
      # github.workflow_sha would check out the fork, not the central tools.
      tool_ref: '37bb948a0ea8aa0f8ddd02f609d5ddcf42e05d97'
